<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body>

    <h1>Login</h1>

    <form method="POST">

        <label>Usuário:</label>
        <input type="text" name="username" required>

        <br><br>

        <label>Senha:</label>
        <input type="password" name="password" required>

        <br><br>

        <button type="submit">Entrar</button>

    </form>

</body>

</html>
